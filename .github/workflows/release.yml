name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Gleam
        uses: gleam-lang/setup-erlang@v1
      - name: Build
        run: make build
      - name: Create release
        run: |
          make release
          gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --notes "SHAE Gleam Web API" dist/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
